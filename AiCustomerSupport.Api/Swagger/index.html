<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

        <title>Swagger UI</title>

        <link rel="stylesheet"
              type="text/css"
              href="./swagger-ui.css">

        <style>
            #chat-panel {
                margin: 20px;
                padding: 15px;
                color: white; 
                border: 1px solid #ccc;
                border-radius: 8px
            }


            #connect-signalr {
                border: 1px solid green;
                border-radius: 6px;
                background-color: green;
                color: white;
                font-size: 18px;
                padding: 13px
            }

            #connect-signalr:hover {
                background-color: white;
                color: green;
                cursor: pointer
            }


            #messages {
                height: 500px;
                overflow-y: auto;
                color: white;
                background-color: white;
                border: 1px solid #ddd;
                padding: 10px 20px;
                margin-bottom: 10px;
                border-radius: 8px
            }

            .message {
                padding: 14px;
                margin: 10px 0px;
                width: fit-content;
                max-width: 40%;
                overflow-wrap: break-word;
                border-radius: 12px; 
                color: white;
            }

            .message a {
                display: block;
                margin-top: 8px;
                color: #93C5FD;
                text-decoration: underline;
            }

            .message a:hover {
                display: block;
                margin-top: 8px;
                color: mediumpurple;
                text-decoration: none;
            }

            .message-sent {
                margin-left: auto;
                background-color: #1E3A5F;
            }


            .message-received {
                margin-right: auto;
                background-color: green;
            }


            #ticket-id {
                border-radius: 6px;
                margin: 15px 15px 30px 0px;
                padding: 5px;
                font-size: 15px;
                height: 25px;
            }


            #messages-button {
                border: 1px solid green;
                border-radius: 6px;
                background-color: green;
                color: white;
                font-size: 15px;
                padding: 10px;
            }

            #messages-button:hover {
                background-color: white;
                color: green;
                cursor: pointer
            }

        </style>
    </head>

    <body>

        <div style="border: 1px solid white; padding: 15px; margin: 15px 15px 30px 15px;">

            <h2 style="color: white;">
                SignalR Test Chat: Scroll to the bottom of this page to view messages received in real time.
            </h2>

            <h3 style="color: white;"> 
                Click "Connect SignalR" button to receive notifications and messages. 
            </h3>
        
        </div>
        


        <!-- Normal Swagger UI -->
        <div id="swagger-ui"></div>


        <!-- Chat area -->

        <div id="chat-panel">



            <div style="display: flex; justify-content: space-between; align-items:center;">
                <h2>SignalR Test Chat</h2>

                <button id="connect-signalr">
                    Connect SignalR
                </button>
            </div>


            <div>
                <input id="ticket-id" type="number" placeholder="Enter Ticket ID" min="1">

                <button id="messages-button">
                    Get Messages
                </button>
            </div>
            


            <div id="messages"></div>

        </div>




        <!-- Supplied by Swashbuckle -->
        <script src="./swagger-ui-bundle.js"></script>
        <script src="./swagger-ui-standalone-preset.js"></script>

        <script>
            window.onload = function () {

                var configObject = JSON.parse('%(ConfigObject)');

                configObject.dom_id = "#swagger-ui";

                configObject.presets = [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ];

                configObject.layout = "StandaloneLayout";

                // Automatically attach JWT to every API request
                configObject.requestInterceptor = function (request) {

                    const token = localStorage.getItem("jwt_token");

                    if (token) {
                        request.headers = request.headers || {};
                        request.headers["Authorization"] = "Bearer " + token;
                    }

                    return request;
                };


                // Capture JWT after successful login
                configObject.responseInterceptor = function (response) {

                    if (
                        response.url &&
                        response.url.includes("/api/Auth/login") &&
                        response.status >= 200 &&
                        response.status < 300
                    ) {
                        try {
                            const body = JSON.parse(response.text);
                            const token = body?.token;

                            if (token) {

                                localStorage.setItem("jwt_token", token);

                                console.log("JWT saved successfully.");

                                // Also update Swagger's Authorize button
                                if (window.ui) {
                                    window.ui.preauthorizeApiKey(
                                        "Bearer",
                                        token
                                    );
                                }
                            }

                        } catch (error) {
                            console.error("JWT extraction failed:", error);
                        }
                    }

                    return response;
                };


                window.ui = SwaggerUIBundle(configObject);

                window.dispatchEvent(new Event("swagger-ready"));
            };
        </script>


        <!-- SignalR library -->
        <script src="/swagger/signalr.min.js"></script>


        <!-- Custom JavaScript -->
        <script src="/swagger/SignalRTest.js"></script>

    </body>
</html>
